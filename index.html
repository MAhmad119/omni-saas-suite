<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSaaS - AI Content & SEO Growth Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col md:flex-row">

    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col justify-between">
        <div>
            <!-- Brand Logo -->
            <div class="flex items-center gap-3 mb-8">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide text-white">OmniSaaS AI</h1>
                    <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full font-medium">v1.0 Pro</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="space-y-2">
                <button onclick="switchTab('copywriter')" id="btn-copywriter" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left bg-blue-600/20 text-blue-400 border border-blue-500/30">
                    <i class="fa-solid fa-pen-nib w-5"></i> AI Copywriter
                </button>
                <button onclick="switchTab('seo')" id="btn-seo" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                    <i class="fa-solid fa-magnifying-glass-chart w-5"></i> SEO Meta Builder
                </button>
                <button onclick="switchTab('optimizer')" id="btn-optimizer" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                    <i class="fa-solid fa-file-code w-5"></i> Code & Asset Clean
                </button>
            </nav>
        </div>

        <!-- Sidebar Footer Status -->
        <div class="pt-6 border-t border-slate-800/80 text-xs text-slate-500 flex items-center justify-between">
            <span class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Engine Active
            </span>
            <span>Vercel Ready</span>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 md:p-10 max-w-6xl mx-auto">
        
        <!-- Top Bar -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-slate-800">
            <div>
                <h2 id="page-title" class="text-2xl font-bold text-white">AI Copywriter & Post Generator</h2>
                <p id="page-desc" class="text-slate-400 text-sm mt-1">Generate high-converting marketing copy and social media content in seconds.</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300">
                    <i class="fa-solid fa-bolt text-amber-400 mr-1.5"></i> Micro-SaaS Engine
                </span>
            </div>
        </header>

        <!-- TAB 1: AI COPYWRITER -->
        <section id="tab-copywriter" class="tab-content block space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Input Panel -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Topic or Product Name</label>
                        <input type="text" id="ai-topic" placeholder="e.g. OutreachAI - Cold Email Tool" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Content Type</label>
                        <select id="ai-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                            <option value="ad">Facebook / Google Ad Copy</option>
                            <option value="tweet">Viral Twitter / X Thread</option>
                            <option value="linkedin">LinkedIn Professional Post</option>
                            <option value="email">Cold Outreach Email</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Tone of Voice</label>
                        <select id="ai-tone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                            <option value="persuasive">Persuasive & High Energy</option>
                            <option value="professional">Professional & Formal</option>
                            <option value="casual">Casual & Conversational</option>
                        </select>
                    </div>

                    <button onclick="generateCopy()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3.5 rounded-xl transition shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-sparkles"></i> Generate Copy
                    </button>
                </div>

                <!-- Output Panel -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking
